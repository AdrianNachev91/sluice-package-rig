# Builds the HEIF decoder Sluice bundles, one archive per machine it ships to.
#
# Why this lives here rather than in Sluice's own repository. Nothing publishes a libheif build that
# covers all four machines. Upstream ships source only. photoprism builds Linux per distro codename.
# The Windows binary in Sluice's CI is one person's 2022 repository. Homebrew is macOS alone, and
# linked to its own prefix. macOS cannot be built from the developer machine at all, and this
# repository is public, where macOS runners are free.
#
# Dynamically linked on purpose. libheif and libde265 are LGPL, and shipping the shared library
# beside the tool is what lets somebody replace it. A static binary would owe relinkable objects.
#
# Decode only. Sluice reads HEIC and AVIF and writes neither, so no encoder is built. That keeps
# x265 out, which is GPL and would bind the whole archive.
#
# Run it by hand when a version moves, never on a push. Its output is a release that Sluice's
# conveyor.conf points at by URL, the way Conveyor already pulls the JavaFX jmods.

name: Build libheif

on:
  workflow_dispatch:
    inputs:
      libheif_version:
        description: libheif tag to build, without the leading v
        required: true
        default: 1.23.4
      # 1.1.2 rather than the 1.0.x line, because that one declares a cmake_minimum_required below
      # 3.5 and CMake 4 removed support for it. The runner images that ship CMake 4 refuse to
      # configure it at all. 1.1.2 declares 3.16.3.
      libde265_version:
        description: libde265 tag, the HEVC decoder HEIC needs
        required: true
        default: 1.1.2
      dav1d_version:
        description: dav1d tag, the AV1 decoder AVIF needs
        required: true
        default: 1.5.1
      # The tool writes PNG, which is the format Sluice asks it for, and that needs libpng and
      # zlib. Built here rather than taken from the machine, for two reasons. Windows has no system
      # libpng at all, so an archive that expects one is not self-contained. And a build that finds
      # one library's headers and another's runtime produces a tool that decodes correctly and then
      # cannot write the result, which is what macOS did at 1.4.12 headers against a 1.6.58 runtime.
      libpng_version:
        description: libpng tag, which is how the tool writes PNG
        required: true
        default: 1.6.58
      zlib_version:
        description: zlib tag, which libpng needs
        required: true
        default: 1.3.2
      publish:
        description: Publish a release as well as uploading the artifacts
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Four different toolchains. One failing says nothing about the other three, and the first
      # run's whole job is to learn which of them need work.
      fail-fast: false
      matrix:
        include:
          # The oldest supported image rather than the newest. A binary linked against glibc 2.39
          # refuses to start on anything older, where one linked against 2.35 runs on both.
          - machine: linux.amd64
            runs-on: ubuntu-22.04
            archive: tar.gz
          - machine: mac.amd64
            runs-on: macos-13
            archive: tar.gz
          - machine: mac.aarch64
            runs-on: macos-14
            archive: tar.gz
          - machine: windows.amd64
            runs-on: windows-latest
            archive: zip
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - name: Report the environment
        run: |
          cmake --version
          echo "machine: ${{ matrix.machine }}"
          uname -a || ver

      # dav1d is the one dependency here that does not use CMake. Meson and ninja come from pip so
      # the same line works on all three operating systems.
      - name: Install meson and ninja
        run: pip install meson ninja

      # dav1d assembles its x86 paths with nasm and no runner image carries it. Without it meson
      # stops at "Program 'nasm' not found" rather than falling back to C. Apple silicon assembles
      # its own aarch64 paths with the system toolchain and wants nothing extra.
      - name: Install nasm
        if: ${{ matrix.machine != 'mac.aarch64' }}
        run: |
          set -euo pipefail
          case "${{ matrix.machine }}" in
            linux.*)   sudo apt-get update && sudo apt-get install -y nasm ;;
            mac.*)     brew install nasm ;;
            windows.*) choco install nasm -y --no-progress
                       # Found rather than guessed. The package's install directory is chocolatey's
                       # to change, and a wrong guess here surfaces later as meson reporting no
                       # nasm, which names the wrong cause.
                       NASM_DIR=$(dirname "$(find "/c/Program Files" "/c/Program Files (x86)" -maxdepth 2 -name nasm.exe -print -quit)")
                       echo "found nasm in $NASM_DIR"
                       echo "$NASM_DIR" >> "$GITHUB_PATH" ;;
          esac

      - name: Fetch the sources
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/strukturag/libde265/releases/download/v${{ inputs.libde265_version }}/libde265-${{ inputs.libde265_version }}.tar.gz" | tar xz
          curl -fsSL "https://code.videolan.org/videolan/dav1d/-/archive/${{ inputs.dav1d_version }}/dav1d-${{ inputs.dav1d_version }}.tar.gz" | tar xz
          curl -fsSL "https://github.com/strukturag/libheif/releases/download/v${{ inputs.libheif_version }}/libheif-${{ inputs.libheif_version }}.tar.gz" | tar xz
          curl -fsSL "https://github.com/madler/zlib/releases/download/v${{ inputs.zlib_version }}/zlib-${{ inputs.zlib_version }}.tar.gz" | tar xz
          curl -fsSL "https://github.com/pnggroup/libpng/archive/refs/tags/v${{ inputs.libpng_version }}.tar.gz" | tar xz
          ls -d libde265-* dav1d-* libheif-* zlib-* libpng-*

      # Every library and the tool itself install into one staging tree, which is also what gets
      # archived. The runtime search path is set at configure time rather than patched afterwards,
      # so the tool finds its own libraries wherever the archive is unpacked.
      - name: Set the staging paths
        run: |
          set -euo pipefail
          echo "STAGE=$PWD/stage" >> "$GITHUB_ENV"
          case "${{ matrix.machine }}" in
            linux.*)   echo "RPATH=\$ORIGIN/../lib"        >> "$GITHUB_ENV" ;;
            mac.*)     echo "RPATH=@executable_path/../lib" >> "$GITHUB_ENV" ;;
            windows.*) echo "RPATH="                        >> "$GITHUB_ENV" ;;
          esac
          # An rpath is where the tool looks when it RUNS. The linker needs telling separately, and
          # GNU ld says so itself: "libdav1d.so.7, needed by libheif.so, not found (try using
          # -rpath or -rpath-link)". Nothing else needs it. Apple's linker records each library's
          # own install name, and Windows resolves by DLL name at load time.
          if [ "${{ matrix.machine }}" = "linux.amd64" ]; then
            echo "LDFLAGS=-Wl,-rpath-link,$PWD/stage/lib" >> "$GITHUB_ENV"
          fi

      # Every CMake build here pins the library directory. Left alone, one of them installs to
      # lib64 or to a per-architecture subdirectory, and the next build's linker then searches a
      # directory nothing was installed into.
      - name: Build zlib
        run: |
          set -euo pipefail
          cmake -S zlib-${{ inputs.zlib_version }} -B build-zlib \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$STAGE" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_INSTALL_RPATH="$RPATH" \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON
          cmake --build build-zlib --config Release --target install

      - name: Build libpng
        run: |
          set -euo pipefail
          cmake -S libpng-${{ inputs.libpng_version }} -B build-png \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$STAGE" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_PREFIX_PATH="$STAGE" \
            -DCMAKE_INSTALL_RPATH="$RPATH" \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DPNG_SHARED=ON \
            -DPNG_STATIC=OFF \
            -DPNG_TOOLS=OFF \
            -DPNG_TESTS=OFF
          cmake --build build-png --config Release --target install

      - name: Build libde265
        run: |
          set -euo pipefail
          cmake -S libde265-${{ inputs.libde265_version }} -B build-de265 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$STAGE" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_INSTALL_RPATH="$RPATH" \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DENABLE_SDL=OFF \
            -DENABLE_ENCODER=OFF
          cmake --build build-de265 --config Release --target install

      - name: Build dav1d
        run: |
          set -euo pipefail
          # Named here so a missing assembler reads as a missing assembler, rather than as whatever
          # meson says several hundred lines later.
          nasm -v || echo "no nasm on PATH, which is expected on Apple silicon and a failure anywhere else"
          meson setup build-dav1d "dav1d-${{ inputs.dav1d_version }}" \
            --prefix="$STAGE" \
            --libdir=lib \
            --buildtype=release \
            --default-library=shared \
            --vsenv \
            -Denable_tools=false \
            -Denable_tests=false
          meson install -C build-dav1d

      # Plugin loading off, so both decoders link straight into libheif and the archive holds no
      # separate plugin directory to find at runtime. Every encoder is off explicitly rather than by
      # default, since a default that changes would pull x265 in and bind the archive to GPL.
      #
      # Doxygen is refused rather than merely unwanted. Where the image happens to carry it, libheif
      # adds an apidoc target that then fails on missing Graphviz map files, so a documentation tool
      # nobody asked for decides whether the build succeeds. Windows is the image that has it.
      - name: Build libheif and its tools
        run: |
          set -euo pipefail
          cmake -S libheif-${{ inputs.libheif_version }} -B build-heif \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$STAGE" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_PREFIX_PATH="$STAGE" \
            -DCMAKE_INSTALL_RPATH="$RPATH" \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=OFF \
            -DENABLE_PLUGIN_LOADING=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_Doxygen=ON \
            -DWITH_LIBDE265=ON \
            -DWITH_DAV1D=ON \
            -DWITH_AOM_DECODER=OFF \
            -DWITH_AOM_ENCODER=OFF \
            -DWITH_X265=OFF \
            -DWITH_SvtEnc=OFF \
            -DWITH_RAV1E=OFF \
            -DWITH_EXAMPLES=ON \
            -DWITH_EXAMPLE_HEIF_VIEW=OFF \
            -DWITH_EXAMPLE_HEIF_THUMB=OFF
          cmake --build build-heif --config Release --target install

      # The decoder is heif-dec and heif-convert is the compatibility alias upstream still creates,
      # a symlink here and a real copy on Windows. Sluice looks for heif-convert, so the check is
      # that the alias survived both the build and the archive.
      - name: Prove the tool runs and decodes
        run: |
          set -euo pipefail
          find "$STAGE" -type f | sort
          if [ "${{ matrix.machine }}" = "windows.amd64" ]; then
            TOOL="$STAGE/bin/heif-convert.exe"
          else
            TOOL="$STAGE/bin/heif-convert"
          fi
          "$TOOL" --version
          "$TOOL" "libheif-${{ inputs.libheif_version }}/examples/example.heic" heic-out.png
          "$TOOL" "libheif-${{ inputs.libheif_version }}/examples/example.avif" avif-out.png
          ls -l heic-out*.png avif-out*.png

      # Read the tool's own linkage rather than trusting the rpath flags. A library resolved from
      # the runner's own directories works here and is absent on a user's machine.
      - name: Report what the tool links against
        continue-on-error: true
        run: |
          case "${{ matrix.machine }}" in
            linux.*)   ldd "$STAGE/bin/heif-dec" ;;
            mac.*)     otool -L "$STAGE/bin/heif-dec" ;;
            windows.*) ls -l "$STAGE/bin" ;;
          esac

      - name: Make the archive
        run: |
          set -euo pipefail
          NAME="libheif-${{ inputs.libheif_version }}-${{ matrix.machine }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd "$STAGE" && 7z a "../$NAME.zip" .)
          else
            tar czf "$NAME.tar.gz" -C "$STAGE" .
          fi
          ls -l "$NAME".*
          echo "ARCHIVE=$NAME.${{ matrix.archive }}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.machine }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  # Its own job, so a release only exists once every machine built. A release carrying three of four
  # archives is worse than none: conveyor.conf names all four by URL, and the missing one fails the
  # packaging build with a download error rather than anything that names the cause.
  publish:
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: archives

      # gh rather than a third-party release action. It ships with the runner, so the release step
      # adds nothing to the supply chain of a package that gets signed.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          find archives -type f | sort
          gh release create "libheif-${{ inputs.libheif_version }}" \
            --repo "${{ github.repository }}" \
            --title "libheif ${{ inputs.libheif_version }}" \
            --notes "Decode-only libheif ${{ inputs.libheif_version }}, with libde265 ${{ inputs.libde265_version }} for HEIC and dav1d ${{ inputs.dav1d_version }} for AVIF. One archive per machine Sluice ships to. Built by .github/workflows/build-libheif.yml in this repository." \
            $(find archives -type f | sort)
